<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alquemia</title>

<link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin.css') }}">
<!-- Bloque para estilos adicionales por página -->
   {% block estilos %}
   {% endblock %}


</head>
<body>

<!-- Checkbox hack -->
<input type="checkbox" id="menu-toggle">

<!-- Botón hamburguesa -->
<label for="menu-toggle" class="menu-btn">☰</label>

<!-- Sidebar -->
<aside id="barra-lateral">
    <div class="marca">
        Alquemia
        <!-- X para cerrar solo en móvil -->
        <label for="menu-toggle" class="close-btn">×</label>
    </div>
    <nav>
        <ul class="menu-lateral">
            <li>
                <a href="{{ url_for('productos') }}" class="{% if request.path.startswith(url_for('productos')) %}active{% endif %}">
                    <i class='bx bx-package icono'></i>Productos
                </a>
            </li>
            <li>
                <a href="{{ url_for('listar_categorias') }}" class="{% if request.path.startswith(url_for('listar_categorias')) %}active{% endif %}">
                    <i class='bx bx-category icono'></i>Categorías
                </a>
            </li>
            <li>
                <a href="{{ url_for('lista_devoluciones') }}" class="{% if request.path.startswith(url_for('lista_devoluciones')) %}active{% endif %}">
                    <i class='bx bx-undo icono'></i>Devoluciones
                </a>
            </li>
            <li>
                <a href="{{ url_for('pedido') }}" class="{% if request.path.startswith(url_for('pedido')) %}active{% endif %}">
                    <i class='bx bx-cart icono'></i>Pedidos
                </a>
            </li>

            <li>
                <a href="{{ url_for('cerrar_sesion') }}">
                    <i class='bx bx-log-out icono'></i> Cerrar sesión
                </a>
            </li>
        </ul>
    </nav>
</aside>

<!-- Contenido principal -->
<main id="contenido">
    <section class="panel-principal">
        {% block contenido %}
        {% endblock %}
    </section>
</main>

</body>
</html>
